<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>agentcast</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.connected { background: var(--green); }
  .spacer { flex: 1; }
  .toggle-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle-btn.active { color: var(--text); border-color: var(--accent); background: rgba(88,166,255,.1); }
  .toggle-btn:hover { color: var(--text); }

  main { flex: 1; display: flex; min-height: 0; }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    flex: 1;
  }
  .pane.hidden { display: none; }
  #pane-console { border-right: 1px solid var(--border); }
  #pane-console.hidden + #pane-html { border-left: none; }

  .pane-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .pane-header .title { font-weight: 600; color: var(--text); }
  .close-btn {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .close-btn:hover { color: var(--text); background: rgba(255,255,255,.08); }

  /* console pane */
  #console-log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
  .line .ts { color: #484f58; margin-right: 8px; }
  .line.user .body { color: #79c0ff; }
  .line.user .body::before { content: "❯ "; color: var(--accent); }
  .line.assistant .body { color: var(--text); }
  .line.assistant .body::before { content: "● "; color: var(--green); }
  .line.tool_use .body { color: var(--yellow); }
  .line.tool_use .body::before { content: "⚙ "; }
  .line.tool_result .body { color: var(--muted); }
  .line.tool_result .body::before { content: "  ⮑ "; }
  .line.status .body, .line.info .body { color: var(--muted); font-style: italic; }

  /* html pane */
  #html-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 6px 8px 0;
    background: var(--panel);
    flex: 0 0 auto;
  }
  #html-tabs:empty { display: none; }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab.active { color: var(--text); background: var(--bg); border-color: var(--accent); }
  #html-frame-wrap { flex: 1; min-height: 0; background: #fff; }
  #html-frame { width: 100%; height: 100%; border: none; display: block; }
  .empty-note {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
    background: var(--bg);
  }
  /* sources & activity */
  .src {
    display: inline-block;
    font-size: 10px;
    line-height: 1;
    padding: 2px 5px;
    margin-right: 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--muted);
    vertical-align: 1px;
  }
  .src.hermes { color: #d2a8ff; border-color: #6e40c9; }
  .src.claude-code { color: #79c0ff; border-color: #1f6feb; }
  .line.user.from-chat .body::before { content: "✉ "; color: #d2a8ff; }
  #activity { display: flex; gap: 8px; overflow: hidden; min-width: 0; }
  .act {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text);
    padding: 3px 10px; border-radius: 12px;
    background: rgba(210,168,255,.12); border: 1px solid #6e40c9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw;
  }
  .act .pulse { width: 7px; height: 7px; border-radius: 50%; background: #d2a8ff; flex: 0 0 auto;
    animation: pulse 1.2s ease-in-out infinite; }
  .act .detail { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .act .pulse { animation: none; } }
  .pane-header a.link-btn, .pane-header button.link-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); font-size: 11px; padding: 2px 8px; text-decoration: none; cursor: pointer;
  }
  .pane-header .link-btn:hover { color: var(--text); border-color: var(--accent); }
  .pane-header .link-btn[hidden] { display: none; }
  #pane-html .close-btn { margin-left: 4px; }
  #html-actions { margin-left: auto; display: flex; gap: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* phones: stack panes, output gets the larger share */
  @media (max-width: 720px) {
    header { padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); flex-wrap: wrap; }
    header h1 { display: none; }
    #activity { order: 10; flex-basis: 100%; }
    .act { max-width: 100%; }
    main { flex-direction: column; }
    #pane-console { border-right: none; border-bottom: 1px solid var(--border); flex: 0 0 38%; }
    #pane-console.hidden { flex: 0; }
    #pane-html { flex: 1; }
    .tab { max-width: 140px; }
  }

  #all-closed {
    flex: 1;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <h1>agentcast</h1>
    <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">接続中...</span></div>
    <div id="activity" aria-live="polite"></div>
    <div class="spacer"></div>
    <button class="toggle-btn active" id="toggle-console">Console</button>
    <button class="toggle-btn active" id="toggle-html">Output</button>
  </header>

  <main>
    <section class="pane" id="pane-console">
      <div class="pane-header">
        <span class="title">Console</span>
        <button class="close-btn" data-close="console" title="閉じる">×</button>
      </div>
      <div id="console-log"></div>
    </section>

    <section class="pane" id="pane-html">
      <div class="pane-header">
        <span class="title">Output</span>
        <span id="html-actions">
          <button class="link-btn" id="copy-link" hidden>リンクをコピー</button>
          <a class="link-btn" id="open-link" target="_blank" rel="noopener" hidden>全画面で開く</a>
        </span>
        <button class="close-btn" data-close="html" title="閉じる">×</button>
      </div>
      <div id="html-tabs"></div>
      <div id="html-frame-wrap">
        <div class="empty-note" id="html-empty">まだ出力がありません</div>
      </div>
    </section>

    <div id="all-closed">両方のペインが閉じています。上のボタンで再表示できます。</div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('console-log');
  const tabs = $('html-tabs');
  const frameWrap = $('html-frame-wrap');
  const htmlEmpty = $('html-empty');
  let frame = null;

  // ---- pane visibility ----
  const panes = {
    console: { el: $('pane-console'), btn: $('toggle-console') },
    html: { el: $('pane-html'), btn: $('toggle-html') },
  };
  function setPane(name, visible) {
    panes[name].el.classList.toggle('hidden', !visible);
    panes[name].btn.classList.toggle('active', visible);
    localStorage.setItem('pane-' + name, visible ? '1' : '0');
    const anyVisible = !panes.console.el.classList.contains('hidden') ||
                       !panes.html.el.classList.contains('hidden');
    $('all-closed').style.display = anyVisible ? 'none' : 'flex';
  }
  function paneVisible(name) { return !panes[name].el.classList.contains('hidden'); }
  // ?panes=output / ?panes=console forces a single pane (projector, phone)
  const forced = new URLSearchParams(location.search).get('panes');
  for (const name of ['console', 'html']) {
    panes[name].btn.addEventListener('click', () => setPane(name, !paneVisible(name)));
    if (forced) {
      const want = forced === 'output' ? 'html' : forced;
      panes[name].el.classList.toggle('hidden', name !== want);
      panes[name].btn.classList.toggle('active', name === want);
    } else if (localStorage.getItem('pane-' + name) === '0') setPane(name, false);
  }
  document.querySelectorAll('.close-btn').forEach((b) =>
    b.addEventListener('click', () => setPane(b.dataset.close, false)));

  // ---- console rendering ----
  const MAX_LINES = 1000;
  let autoScroll = true;
  log.addEventListener('scroll', () => {
    autoScroll = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  });
  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toTimeString().slice(0, 8);
  }
  // "hermes:discord" -> {cls: "hermes", label: "Discord"}
  function sourceInfo(source) {
    const s = String(source || 'agent');
    const [head, sub] = s.split(':');
    const names = { 'claude-code': 'Claude Code', hermes: 'Hermes', codex: 'Codex', agent: 'agent' };
    const subs = { discord: 'Discord', slack: 'Slack', telegram: 'Telegram', cli: 'CLI' };
    const label = sub ? (subs[sub] || sub) : (names[head] || head);
    return { cls: head.replace(/[^a-z0-9-]/gi, ''), label, chat: !!sub && sub !== 'cli' };
  }
  const seenSources = new Set();
  function addConsoleLine(ev) {
    const div = document.createElement('div');
    const info = sourceInfo(ev.source);
    div.className = 'line ' + (ev.subtype || 'info') + (info.chat ? ' from-chat' : '');
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = fmtTime(ev.ts);
    const body = document.createElement('span');
    body.className = 'body';
    body.textContent = ev.text;
    if (ev.source) {
      seenSources.add(ev.source);
      const tag = document.createElement('span');
      tag.className = 'src ' + info.cls;
      tag.textContent = info.label;
      div.append(ts, tag, body);
    } else {
      div.append(ts, body);
    }
    log.appendChild(div);
    while (log.children.length > MAX_LINES) log.removeChild(log.firstChild);
    if (autoScroll) log.scrollTop = log.scrollHeight;
  }

  // ---- html rendering ----
  const htmlItems = [];   // {id, title, content, ts}
  let activeId = null;
  let followLatest = true;
  function renderTabs() {
    tabs.innerHTML = '';
    for (const item of htmlItems) {
      const b = document.createElement('button');
      b.className = 'tab' + (item.id === activeId ? ' active' : '');
      b.textContent = item.title;
      b.title = item.title + ' (' + fmtTime(item.ts) + ')';
      b.addEventListener('click', () => {
        followLatest = item === htmlItems[htmlItems.length - 1];
        showHtml(item.id);
      });
      tabs.appendChild(b);
    }
  }
  const copyBtn = $('copy-link');
  const openLink = $('open-link');
  function updateLinks(item) {
    const has = !!(item && item.key);
    copyBtn.hidden = openLink.hidden = !has;
    if (has) openLink.href = '/o/' + item.key;
  }
  copyBtn.addEventListener('click', async () => {
    const item = htmlItems.find((i) => i.id === activeId);
    if (!item || !item.key) return;
    const url = location.origin + '/o/' + item.key;
    try { await navigator.clipboard.writeText(url); copyBtn.textContent = 'コピーしました'; }
    catch { prompt('リンク', url); }
    setTimeout(() => { copyBtn.textContent = 'リンクをコピー'; }, 1500);
  });
  // #o=<key> in the URL pins that output (links posted to chat use this)
  let pinnedKey = (location.hash.match(/o=([A-Za-z0-9_-]+)/) || [])[1] || null;
  window.addEventListener('hashchange', () => {
    pinnedKey = (location.hash.match(/o=([A-Za-z0-9_-]+)/) || [])[1] || null;
    const it = pinnedKey && htmlItems.find((i) => i.key === pinnedKey);
    if (it) { followLatest = false; showHtml(it.id); }
  });
  function showHtml(id) {
    const item = htmlItems.find((i) => i.id === id);
    if (!item) return;
    activeId = id;
    updateLinks(item);
    htmlEmpty.style.display = 'none';
    // recreate the iframe each time: WebKit doesn't reliably re-render
    // when srcdoc is reassigned on a sandboxed iframe
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.id = 'html-frame';
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.srcdoc = item.content;
    frameWrap.appendChild(frame);
    renderTabs();
  }
  function addHtml(item) {
    // same key = the same artifact re-sent (replay after a server restart)
    if (item.key) {
      const i = htmlItems.findIndex((h) => h.key === item.key);
      if (i >= 0) {
        const wasActive = htmlItems[i].id === activeId;
        htmlItems.splice(i, 1);
        if (wasActive) activeId = null;
      }
    }
    htmlItems.push(item);
    while (htmlItems.length > 30) htmlItems.shift();
    if (pinnedKey && item.key === pinnedKey) { followLatest = false; showHtml(item.id); return; }
    if (followLatest || activeId === null) showHtml(item.id);
    else renderTabs();
  }

  // ---- activity (which agent is working right now) ----
  const actEl = $('activity');
  const activity = new Map();
  function renderActivity() {
    actEl.innerHTML = '';
    for (const [source, a] of activity) {
      if (a.state !== 'working') continue;
      const info = sourceInfo(source);
      const chip = document.createElement('div');
      chip.className = 'act';
      const p = document.createElement('span'); p.className = 'pulse';
      const t = document.createElement('span'); t.textContent = (a.label || info.label) + ' 作業中';
      chip.append(p, t);
      if (a.detail) { const d = document.createElement('span'); d.className = 'detail'; d.textContent = a.detail; chip.append(d); }
      actEl.appendChild(chip);
    }
  }
  function setActivity(a) { activity.set(a.source, a); renderActivity(); }

  // ---- websocket ----
  const dot = $('conn-dot');
  const connText = $('conn-text');
  let retryMs = 1000;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws?role=viewer');
    ws.onopen = () => {
      dot.classList.add('connected');
      connText.textContent = '接続済み';
      retryMs = 1000;
    };
    ws.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }
      if (ev.type === 'init' || ev.type === 'reset') {
        log.innerHTML = '';
        htmlItems.length = 0;
        activeId = null;
        followLatest = true;
        tabs.innerHTML = '';
        if (frame) { frame.remove(); frame = null; }
        htmlEmpty.style.display = 'flex';
        updateLinks(null);
        activity.clear();
        for (const a of ev.activity || []) activity.set(a.source, a);
        renderActivity();
        for (const c of ev.console || []) addConsoleLine(c);
        for (const h of ev.html || []) addHtml(h);
      } else if (ev.type === 'console') {
        addConsoleLine(ev);
      } else if (ev.type === 'html') {
        addHtml(ev);
      } else if (ev.type === 'activity') {
        setActivity(ev);
      } else if (ev.type === 'status') {
        addConsoleLine({ subtype: 'status', text: '[' + ev.text + ']', ts: ev.ts });
      }
    };
    ws.onclose = () => {
      dot.classList.remove('connected');
      connText.textContent = '再接続中...';
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 15000);
    };
    ws.onerror = () => ws.close();
  }
  connect();
})();
</script>
</body>
</html>
